[package]
name = "code-mode-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "code-mode-mcp-server"

[dependencies]
anyhow = "=1.0.100"
async-stream = "=0.3.6"
axum = { version = "=0.8.8", features = ["macros"] }
deno_core = "=0.412.0"
deno_error = "=0.7.1"
futures = "=0.3.31"
http = "=1.3.1"
jsonschema = { version = "=0.56.0", default-features = false }
process-wrap = { version = "=10.0.1", features = ["tokio1", "process-group"] }
rmcp = { version = "=3.4.1", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
serde_v8 = { version = "=0.321.0", features = ["v8"] }
sysinfo = { version = "=0.38.2", default-features = false, features = ["system"] }
tokio = { version = "=1.48.0", features = ["full"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }
tower-http = { version = "=0.6.11", features = ["limit", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
rust-embed = { version = "=8.12.0", features = ["debug-embed"] }
mime_guess = "=2.0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

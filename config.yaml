version: 1
server:
  listen: "127.0.0.1:8080"
  mcp_path: "/mcp"
  auth:
    client_token_env: GATEWAY_CLIENT_TOKEN
    admin_token_env: GATEWAY_ADMIN_TOKEN
upstreams: {}
search:
  provider: keyword
  options: {}
  default_limit: 5
  max_limit: 20
  max_response_bytes: 65536
sandbox:
  provider: deno
  options:
    heap_limit_mb: 128
    worker_memory_limit_mb: 256
  timeout_ms: 30000
  max_concurrent_executions: 4
  max_queue_size: 32
  max_tool_calls: 50
  max_parallel_tool_calls: 4
  max_output_bytes: 131072
policy:
  default: allow
  allow: []
  deny: []
observability:
  database: ./data/gateway.db
  retention_days: 7
  log_level: info
